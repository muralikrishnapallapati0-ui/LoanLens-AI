<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LoanLens – Loan Prediction</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>
  <div class="container">
    <header>
      <h1>LoanLens</h1>
      <p>ML-Loan Eligibility Prediction System</p>
    </header>

    <form action="/predict" method="POST" class="loan-form">
      <div class="form-grid">

        <div class="form-group">
          <label>Gender</label>
          <select name="gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div class="form-group">
          <label>Marital Status</label>
          <select name="married" required>
            <option value="Yes">Married</option>
            <option value="No">Single</option>
          </select>
        </div>

        <div class="form-group">
          <label>Dependents</label>
          <select name="dependents" required>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3+">3+</option>
          </select>
        </div>

        <div class="form-group">
          <label>Education</label>
          <select name="education" required>
            <option value="Graduate">Graduate</option>
            <option value="Not Graduate">Not Graduate</option>
          </select>
        </div>

        <div class="form-group">
          <label>Self Employed</label>
          <select name="self_employed" required>
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </div>

        <div class="form-group">
          <label>Applicant Income (₹)</label>
          <input type="number" name="applicant_income" placeholder="e.g. 5000" required />
        </div>

        <div class="form-group">
          <label>Co-Applicant Income (₹)</label>
          <input type="number" name="coapplicant_income" placeholder="e.g. 1500" required />
        </div>

        <div class="form-group">
          <label>Loan Amount (₹ in thousands)</label>
          <input type="number" name="loan_amount" placeholder="e.g. 150" required />
        </div>

        <div class="form-group">
          <label>Loan Term (months)</label>
          <input type="number" name="loan_term" placeholder="e.g. 360" required />
        </div>

        <div class="form-group">
          <label>Credit History</label>
          <select name="credit_history" required>
            <option value="1">Good </option>
            <option value="0">Bad </option>
          </select>
        </div>

        <div class="form-group">
          <label>Property Area</label>
          <select name="property_area" required>
            <option value="Urban">Urban</option>
            <option value="Semiurban">Semiurban</option>
            <option value="Rural">Rural</option>
          </select>
        </div>

      </div>

      <button type="submit" class="btn-predict">Predict Loan Eligibility</button>
    </form>
  </div>
</body>
</html>
